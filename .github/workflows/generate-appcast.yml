name: Generate Appcast

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to generate appcast for (blank selects the latest release)'
        required: false
        type: string

concurrency:
  group: personal-appcast-pages
  cancel-in-progress: false

jobs:
  generate-appcast:
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Determine release and publishing URLs
        env:
          REQUESTED_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          RELEASE_TAG="$REQUESTED_TAG"
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          fi
          # Limit tags to version identifiers before using them in file paths.
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be a version such as v3.3.1."
            exit 1
          fi
          PAGES_OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          PAGES_BASE_URL="https://$PAGES_OWNER.github.io/${GITHUB_REPOSITORY#*/}"
          printf 'RELEASE_TAG=%s\nPAGES_BASE_URL=%s\n' "$RELEASE_TAG" "$PAGES_BASE_URL" >> "$GITHUB_ENV"

      - name: Checkout publishing repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: site

      - name: Read expected public update identity
        working-directory: site
        run: |
          set -euo pipefail
          PUBLIC_KEY=$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' 'Claude Usage/Resources/Info.plist')
          if [[ ! "$PUBLIC_KEY" =~ ^[A-Za-z0-9+/]{43}=$ ]]; then
            echo "::error::The personal app must have a valid Sparkle public key."
            exit 1
          fi
          printf 'EXPECTED_SPARKLE_PUBLIC_KEY=%s\n' "$PUBLIC_KEY" >> "$GITHUB_ENV"

      - name: Restore or initialize gh-pages
        working-directory: site
        run: |
          set -euo pipefail
          PUBLISHING_REF=$(git ls-remote --heads origin refs/heads/gh-pages)
          if [ -n "$PUBLISHING_REF" ]; then
            git fetch origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
            git switch --create gh-pages --track origin/gh-pages
          else
            # An orphan branch has no main history or tracked source files.
            git switch --orphan gh-pages
          fi
          mkdir -p releases
          touch .nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download and verify Sparkle tools
        env:
          SPARKLE_VERSION: '2.10.0'
          # Official GitHub release asset digest, verified on 2026-10-07.
          SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c
        run: |
          set -euo pipefail
          TOOLS_DIR="$RUNNER_TEMP/sparkle-tools"
          mkdir -p "$TOOLS_DIR"
          ARCHIVE="$TOOLS_DIR/Sparkle-$SPARKLE_VERSION.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$ARCHIVE" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          printf '%s  %s\n' "$SPARKLE_SHA256" "$ARCHIVE" | shasum -a 256 -c -
          tar -xf "$ARCHIVE" -C "$TOOLS_DIR"
          printf 'SPARKLE_TOOLS_DIR=%s\n' "$TOOLS_DIR" >> "$GITHUB_ENV"

      - name: Download and verify our release
        run: |
          set -euo pipefail
          RELEASE_DIR="$RUNNER_TEMP/personal-release"
          mkdir -p "$RELEASE_DIR"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern Claude-Usage.zip --pattern Claude-Usage.zip.sha256 \
            --dir "$RELEASE_DIR"
          cd "$RELEASE_DIR"
          shasum -a 256 -c Claude-Usage.zip.sha256
          unzip -q Claude-Usage.zip -d extracted
          APP_PATH="$RELEASE_DIR/extracted/Claude Usage.app"
          codesign --verify --deep --strict "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          APP_FEED=$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$APP_PATH/Contents/Info.plist")
          APP_KEY=$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$APP_PATH/Contents/Info.plist")
          if [ "$APP_FEED" != "$PAGES_BASE_URL/appcast.xml" ] || [ "$APP_KEY" != "$EXPECTED_SPARKLE_PUBLIC_KEY" ]; then
            echo "::error::The release must bundle this fork's update feed and public key."
            exit 1
          fi
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")
          # Keep older archives so Sparkle can still generate delta updates.
          cp Claude-Usage.zip "$GITHUB_WORKSPACE/site/releases/Claude-Usage-$RELEASE_TAG.zip"
          printf 'APP_VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"

      - name: Generate signed appcast
        working-directory: site
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::error::Configure this fork's SPARKLE_PRIVATE_KEY before publishing updates."
            exit 1
          fi
          # The matching public key must be bundled in the personal app.
          # Keep the private key out of files and command-line arguments.
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_TOOLS_DIR/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "$PAGES_BASE_URL/releases/" \
            --maximum-deltas 5 \
            --maximum-versions 10 \
            releases/
          mv releases/appcast.xml appcast.xml

      - name: Commit publishing branch
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .nojekyll appcast.xml releases/
          if ! git diff --staged --quiet; then
            git commit -m "Update appcast for $RELEASE_TAG (v$APP_VERSION)"
            # Explicit destination, no force push, and never the main branch.
            git push origin HEAD:refs/heads/gh-pages
          fi

      # GITHUB_TOKEN pushes do not trigger branch-based Pages builds. Deploy
      # explicitly while retaining gh-pages as the archive/history store.
      - name: Prepare public Pages files
        working-directory: site
        run: |
          set -euo pipefail
          PUBLIC_DIR="$RUNNER_TEMP/personal-pages"
          mkdir -p "$PUBLIC_DIR"
          cp .nojekyll appcast.xml "$PUBLIC_DIR/"
          cp -R releases "$PUBLIC_DIR/"
          printf 'PAGES_ARTIFACT_DIR=%s\n' "$PUBLIC_DIR" >> "$GITHUB_ENV"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.PAGES_ARTIFACT_DIR }}

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify appcast is accessible
        run: |
          set -euo pipefail
          APPCAST_URL="$PAGES_BASE_URL/appcast.xml"
          curl --fail --location --retry 5 --retry-delay 5 \
            --proto '=https' --tlsv1.2 --output /dev/null "$APPCAST_URL"
          printf 'Published signed updates for %s: %s\n' "$RELEASE_TAG" "$APPCAST_URL"
