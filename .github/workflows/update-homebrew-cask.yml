name: Update Homebrew Cask

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to update the configured personal tap for'
        required: true
        type: string

jobs:
  update-cask:
    # Homebrew stays optional until the owner explicitly configures a tap.
    if: ${{ vars.HOMEBREW_TAP_REPOSITORY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}

    steps:
      - name: Validate personal tap and release
        run: |
          set -euo pipefail
          if [[ ! "$TAP_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::HOMEBREW_TAP_REPOSITORY must be an owner/repository name."
            exit 1
          fi
          TAP_OWNER=$(printf '%s' "${TAP_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          FORK_OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          if [ "$TAP_OWNER" != "$FORK_OWNER" ]; then
            echo "::error::The Homebrew tap must belong to this fork's owner."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be a version such as v3.3.1."
            exit 1
          fi
          printf 'RELEASE_VERSION=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Download and verify our release
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern Claude-Usage.zip --pattern Claude-Usage.zip.sha256
          sha256sum --check Claude-Usage.zip.sha256
          RELEASE_SHA256=$(sha256sum Claude-Usage.zip | awk '{print $1}')
          printf 'RELEASE_SHA256=%s\n' "$RELEASE_SHA256" >> "$GITHUB_ENV"

      - name: Checkout configured personal tap
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update personal cask
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          cask = Path('Casks/claude-usage-tracker.rb')
          content = cask.read_text()
          repository = os.environ['GITHUB_REPOSITORY']
          replacements = {
              'version': f'version "{os.environ["RELEASE_VERSION"]}"',
              'sha256': f'sha256 "{os.environ["RELEASE_SHA256"]}"',
              'url': f'url "https://github.com/{repository}/releases/download/v#{{version}}/Claude-Usage.zip"',
          }
          for field, replacement in replacements.items():
              pattern = rf'(?m)^([ \t]*){field}[ \t]+"[^"\n]*"[ \t]*$'
              content, count = re.subn(pattern, lambda match: match[1] + replacement, content)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {field} field in {cask}; found {count}')
          cask.write_text(content)
          PY

      - name: Commit and push personal tap
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Casks/claude-usage-tracker.rb
          if ! git diff --staged --quiet; then
            git commit -m "Update claude-usage-tracker to version $RELEASE_VERSION"
            git push
          fi
